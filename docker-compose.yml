version: '3.8'

services:
  android-docs:
    build:
      context: .
      dockerfile: Dockerfile
    image: android-design-system:latest
    container_name: android-design-system
    ports:
      - "8081:80"
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://localhost/healthcheck" ]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
